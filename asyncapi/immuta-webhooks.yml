delivery:
  transport: HTTP POST to a subscriber-supplied URL
  response_deadline_seconds: 10
  timeout_behavior: requests that do not get a response within 10 seconds time out
  retry: manual retry by webhook id (retry endpoint documented in the Govern API)
  signing: Request app webhooks carry a signingKey; TLS verification is toggled per webhook with verifyTls
  subscription_model: a webhook registration lists the notificationType values it wants, plus actionType
    (triggered or received) and a global flag to receive events that do not pertain to the registering
    user
