- name: Govern app webhooks
  docs: https://documentation.immuta.com/saas/developer-guides/api-intro/immuta-v1-api/configure-your-instance-of-immuta/webhooks
  management_api:
    create: POST /webhooks
    search: GET /webhooks
    get_by_id: GET /webhooks/{id}
    notification_actions: GET /webhooks/actions
    delivery_history: GET /webhooks/history
    retry: POST /webhooks/history/retry/{id}
    delete: DELETE /webhooks/{id}
  summary: Every action in Immuta that generates a notification is also available as a webhook. Application
    Admins can register webhooks for system events; any user can register webhooks for access-request
    and activity notifications.
