- status: 400
  title: Bad request — credentials supplied for a manually bootstrapped integration
  surface: Integrations API
  method: DELETE
  example: 'Credentials are not required for disable unless the integration was configured
    automatically. If you need to update your integration credentials, use PUT to update
    the integration before disabling.'
  remediation: Remove the authentication credentials from the payload.
- status: 400
  title: Bad request — privileged credentials required to disable an auto-bootstrapped
    integration
  surface: Integrations API
  method: DELETE
  example: Integrations that are automatically configured require privileged credentials
    to disable. Please provide them in your payload.
  remediation: Supply the credentials used when the integration was created with autoBootstrap
    set to true.
- status: 400
  title: Bad request — integration previously failed to create
  surface: Integrations API
  method: POST
  example: 'Use PUT /integrations/1 endpoint to update connection information for Azure
    Synapse Analytics integration on host organization.azure.com (id = 1) that previously
    failed to create.'
  remediation: Use PUT /integrations/{id} to repair the failed integration rather than
    re-POSTing it.
- status: 400
  title: Bad request — non-editable attribute changed
  surface: Integrations API
  method: PUT
  example: Unable to edit integration due to changes of non-editable attribute(s).
  remediation: The message lists the attributes that cannot change; revert them.
- status: 404
  title: Not found — no integration with the given ID
  surface: Integrations API
  methods: [GET, PUT, DELETE]
  example: No integration found with ID 5.
  remediation: List configurations with GET /integrations to find the correct ID.
- status: 409
  title: Conflict — integration already exists on this host
  surface: Integrations API
  method: POST
  example: Azure Synapse Analytics integration already exists on organization.azure.com
    (id = 1).
  remediation: Delete or modify the existing integration; ensure name and config do
    not collide.
- status: 409
  title: Conflict — integration is currently being modified or deleted
  surface: Integrations API
  methods: [PUT, DELETE]
  example: Unable to edit integration with ID 10 in current state editing.
  remediation: Poll GET /integrations/{id}/status until the integration finishes updating,
    then retry.
- status: 422
  title: Unprocessable entity — validation test failed
  surface: Integrations API
  methods: [POST, PUT, DELETE]
  example: Validation of prerequisite setup failed. Unable to create integration.
  remediation: Read the validation results object for the failing test and fix the
    prerequisite.
  reference: https://documentation.immuta.com/saas/developer-guides/api-intro/integrations-api/reference-guides/response-schema
- status: 422
  title: Unprocessable entity — processing error retrieving metastore info
  surface: Integrations API
  method: POST
  example: 'Processing Error: Error trying to get the current metastore info.'
  remediation: Immuta could not reach the Databricks metastore; verify the connection
    credentials and network path.
