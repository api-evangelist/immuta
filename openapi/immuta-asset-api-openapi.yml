    HydratedAccessRequest:
      type: object
      properties:
        id:
          type: string
          format: cuid
        requestingUser:
          type: object
          properties:
            id:
              type: number
            iamId:
              type: string
              description: ID of the IAM the user is associated with
            globalUserId:
              type: string
              format: uuid
              description: Immuta global user ID
            username:
              type: string
              description: Username/login name for the user
            name:
              type: string
              description: Display name
