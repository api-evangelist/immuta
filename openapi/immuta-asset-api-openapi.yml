              type:
              - string
              - 'null'
              description: Email address
            authorizations:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
          required:
          - id
          - iamId
          - globalUserId
          - username
          - name
          title: Immuta User
        user:
          type: object
          properties:
            id:
              type: number
            iamId:
              type: string
              description: ID of the IAM the user is associated with
            globalUserId:
              type: string
              format: uuid
              description: Immuta global user ID
            username:
              type: string
              description: Username/login name for the user
            name:
              type: string
              description: Display name
            email:
              type:
              - string
              - 'null'
              description: Email address
            authorizations:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
          required:
          - id
          - iamId
          - globalUserId
          - username
          - name
          title: Immuta User
        formVersion:
          type: string
        form:
          description: The request form submission
        type:
          type: string
          enum:
          - DATA_ACCESS
          - MASKING_EXCEPTION
          example: DATA_ACCESS
        metadata:
          description: Metadata associated with the access request
        status:
          type: string
          enum:
          - APPROVED
          - CANCELED
          - DENIED
          - PENDING
          - NONE
          - PUBLISHER
          - REVOKED
          - EXPIRED
          example: PENDING
        expiration:
          type: string
          format: date-time
          description: When the temporary access will expire
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        dataProduct:
          type: object
          properties:
            id:
              oneOf:
              - type: string
                format: cuid
              - type: string
                format: uuid
            name:
              type: string
              minLength: 1
              maxLength: 255
              pattern: ^[\p{L}\p{M}\p{N})(\-_/\\\s]*$
              description: Data product name
            description:
              oneOf:
              - type: string
                description: Data product description
                example: All sales records from the current fiscal year
              description: Data product description
          required:
          - id
          - name
        asset:
          type: object
          properties:
            id:
              oneOf:
              - type: string
                format: cuid
              - type: string
                format: uuid
            type:
              type: string
              enum:
              - DATA_OBJECT
            name:
              type: string
              minLength: 1
              description: Asset name
            metadata:
              type: object
              properties:
                subjectMatterExperts:
                  default: []
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Immuta global user ID of the subject matter expert
                      username:
                        type: string
                      name:
                        type: string
                    required:
                    - id
                objectPath:
                  type: array
                  items:
                    type: string
                technology:
                  type: string
                  enum:
                  - Snowflake
                  - PostgreSQL
                  - Databricks
                  - Glue
                  - MySQL
                  - Teradata
                  - MariaDB
                  - Oracle
                  - SQLServer
                  - Trino
                  - Redshift
                  - BigQuery
                host:
                  type: string
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                legacyType:
                  type: string
                dataSourceId:
                  type: number
                description:
                  oneOf:
                  - type: string
                externalLink:
                  oneOf:
                  - type: string
              required:
              - objectPath
              description: Data object asset metadata
          required:
          - id
          - type
          - name
          - metadata
      required:
      - id
      - requestingUser
      - user
      - formVersion
      - type
      - status
      - createdAt
      - updatedAt
      title: Hydrated Access Request
      description: Access request with user and data product metadata
