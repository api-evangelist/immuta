              hostname:
                oneOf:
                - type: string
                  description: Data source hostname
                description: Data source hostname
              database:
                oneOf:
                - type: string
                  description: Data source database name
                description: Data source database name
              schema:
                oneOf:
                - type: string
                  description: Data source schema name
                description: Data source schema name
              table:
                oneOf:
                - type: string
                  description: Data source table name
                description: Data source table name
              prefix:
                oneOf:
                - type: string
                  description: The native S3 prefix
                description: The native S3 prefix
              status:
                type: string
                enum:
                - NONE
                - RESTRICTED
                - SUBSCRIBED
                description: Govern app subscription status
            required:
            - id
            - name
            - type
            - sourceId
            - status
        meta:
          type: object
          properties:
            nextToken:
              oneOf:
              - type: string
                description: Pagination token to fetch the next page of results, or null if there are no more pages.
              description: Pagination token to fetch the next page of results, or null if there are no more pages.
            limit:
              default: 10
              type: number
              minimum: 1
              maximum: 100
              description: The number of items to return per page
          required:
          - nextToken
      required:
      - data
      - meta
