openapi: 3.2.0
info:
  title: Immuta Data Marketplace Request Form API
  description: This is the API for the Immuta Data Marketplace based on the OpenAPI 3.0 specification. The API supports the discovery and management of data products as well as access to those products including both the request and approval process.
  version: '1.0'
  contact:
    name: Support
    url: https://support.immuta.com
    email: support@immuta.com
  termsOfService: https://www.immuta.com/terms-of-service
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://{global-segment}.api.immutacloud.com/marketplace
  description: Marketplace API Endpoint
  variables:
    global-segment:
      default: na
      enum:
      - na
      - eu
      - ap
      description: Marketplace API global segment
tags:
- name: Request Form
  description: APIs for managing request forms
paths:
  /api/data-product/{id}/request-forms:
    get:
      description: Get all the request forms for the specified data product
      operationId: getRequestForms
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataProductRequestForm'
      security:
      - bearer: []
      summary: View all request forms for a data product
      tags:
      - Request Form
  /api/asset/{id}/request-forms:
    get:
      description: Get the request forms assigned to the asset.
      operationId: getAssetRequestForms
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetRequestForms'
      security:
      - bearer: []
      summary: Get request forms for an asset
      tags:
      - Request Form
  /api/request-form:
    post:
      description: Create a request form
      operationId: createRequestForm
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestForm'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestForm'
        '409':
          description: Request form with name already exists.
      security:
      - bearer: []
      summary: Create request form
      tags:
      - Request Form
    get:
      description: Search request forms in the marketplace using the provided filters
      operationId: searchRequestForms
      parameters:
      - name: offset
        required: false
        in: query
        schema:
          minimum: 0
          default: 0
          type: number
      - name: limit
        required: false
        in: query
        schema:
          minimum: 1
          default: 10
          type: number
      - name: sortOrder
        required: false
        in: query
        schema:
          default: asc
          type: string
          enum:
          - asc
          - desc
      - name: sortBy
        required: false
        in: query
        schema:
          default: name
          type: string
          enum:
          - name
          - createdAt
          - updatedAt
      - name: nameFilter
        required: false
        in: query
        description: Filter results by request form name
        schema:
          default: ''
          type: string
      - name: exactMatch
        required: false
        in: query
        description: Whether the filter should be an exact match
        schema:
          default: false
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRequestForm'
      security:
      - bearer: []
      summary: Search request forms
      tags:
      - Request Form
  /api/request-form/{id}:
    get:
      operationId: getRequestFormById
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestForm'
      security:
      - bearer: []
      summary: Get request form by ID
      tags:
      - Request Form
    delete:
      description: Delete a request form
      operationId: deleteRequestFormById
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '204':
          description: ''
      security:
      - bearer: []
      summary: Delete request form by ID
      tags:
      - Request Form
    put:
      description: Update a request form
      operationId: updateRequestForm
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequestForm'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestForm'
      security:
      - bearer: []
      summary: Update request form by ID
      tags:
      - Request Form
  /api/request-form/version/{version}:
    get:
      description: Get request form by its version
      operationId: getRequestFormByVersion
      parameters:
      - name: version
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestForm'
      security:
      - bearer: []
      summary: Get request form by version
      tags:
      - Request Form
  /api/request-form/{id}/data-products:
    get:
      description: Get the data products assigned to the request form
      operationId: getDataProducts
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedDataProducts'
      security:
      - bearer: []
      summary: Get data products assigned to the request form
      tags:
      - Request Form
  /api/request-form/{id}/assets:
    get:
      description: Get the assets assigned to the request form
      operationId: getAssets
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedAssets'
      security:
      - bearer: []
      summary: Get assets assigned to the request form
      tags:
      - Request Form
components:
  schemas:
    LinkedAssets:
      type: array
      items:
        type: object
        properties:
          id:
            oneOf:
            - type: string
              format: cuid
            - type: string
              format: uuid
          name:
            type: string
            minLength: 1
            description: Asset name
          type:
            type: string
            enum:
            - DATA_PRODUCT
            - DATA_OBJECT
          requestType:
            type: string
            enum:
            - DATA_ACCESS
            - MASKING_EXCEPTION
        required:
        - id
        - name
        - type
        - requestType
      description: The assets linked to the request form
