    DataProduct:
      type: object
      properties:
        id:
          oneOf:
          - type: string
            format: cuid
          - type: string
            format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[\p{L}\p{M}\p{N})(\-_/\\\s]*$
