                type: boolean
                description: Whether access to the data product's data sources is suspended
                example: false
              createdBy:
                type: string
                format: uuid
                description: Immuta global user ID of the user who created the data product
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
              status:
                type: string
                enum:
                - APPROVED
                - CANCELED
                - DENIED
                - PENDING
                - NONE
                - PUBLISHER
                - REVOKED
                - EXPIRED
                example: PENDING
              expiration:
                oneOf:
                - type: string
                  format: date-time
