    PaginatedDataProduct:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                oneOf:
                - type: string
                  format: cuid
                - type: string
                  format: uuid
              name:
                type: string
                minLength: 1
                maxLength: 255
                pattern: ^[\p{L}\p{M}\p{N})(\-_/\\\s]*$
                description: Data product name
              description:
                oneOf:
                - type: string
                  description: Data product description
                  example: All sales records from the current fiscal year
                description: Data product description
              domains:
                type: array
                items:
                  type: string
                minItems: 1
                example:
                - 4d004a3a-4568-4c1d-822e-30958ef898dc
