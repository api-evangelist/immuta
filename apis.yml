aid: immuta
name: Immuta
description: 'Immuta is a data security and access-governance platform that lets organizations
  register their cloud data platforms — Snowflake, Databricks (Unity Catalog, Lakebase,
  Spark), Amazon Redshift and Redshift Spectrum, Amazon S3, AWS Lake Formation, Google
  BigQuery, Azure Synapse Analytics, Starburst (Trino) and Teradata — and then author,
  enforce and audit subscription, data and write policies against that data from a
  single control plane. The platform is split into the Govern, Provision (Request)
  and Comply apps, with attribute-based access control, sensitive data discovery and
  tagging, dynamic masking and row-level filtering, purpose-based restrictions, data
  products and an access-request workflow, plus agentic data access controls for governing
  how AI agents and LLMs query sensitive data. Immuta exposes this surface through
  several REST APIs: the Data Marketplace / Request app API (published as OpenAPI 3.0),
  the Govern V1 and V2 APIs, the integrations API and the connections API, alongside
  the Immuta CLI, a webhook event surface and a Terraform provider.'
