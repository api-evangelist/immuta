apis:
- aid: immuta:govern-api
  name: Immuta Govern API
  description: >-
    The Immuta Govern app API — the tenant-hosted REST surface for registering data sources and connections,
    authoring data, subscription and write policies, managing domains, projects, purposes, tags, frameworks,
    identities (bim), licenses, jobs, search filters and webhooks, and generating governance reports.
    It is documented in three layers: the V2 API (declarative policy-as-code, JSON or YAML, same endpoint
    for create and update), the V1 API (full endpoint reference), and the integrations and connections
    APIs for wiring remote data platforms into Immuta. Authenticated with an Immuta API key or a bearer
    token exchanged at /bim/apikey/authenticate. The base URL is the customer's own Immuta SaaS tenant
    host.
  humanURL: https://documentation.immuta.com/saas/developer-guides/api-intro
  baseURL: https://your-immuta-url.immuta.com
  x-tenant-scoped: true
  x-base-url-note: >-
    Immuta SaaS is multi-tenant; the Govern API base URL is the customer's own tenant host (https://<your-tenant>.immuta.com).
    The value here is the host Immuta uses verbatim in its own documented curl examples.
  tags:
  - Data Governance
