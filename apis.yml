- aid: immuta:marketplace-api
  name: Immuta Data Marketplace API
  description: 'The Immuta Data Marketplace API — the REST surface behind the Immuta
    Request (Provision) app. It supports discovery and management of data products,
    the data sources and assets attached to them, request forms and data use agreements,
    and the full access-request lifecycle including approvals, masking-exception requests,
    determinations and revocation. Published by Immuta as an OpenAPI 3.0 document with
    83 operations across 11 tags, authenticated with a bearer JWT personal access token,
    and served per global segment (na, eu, ap) from api.immutacloud.com.'
  humanURL: https://documentation.immuta.com/saas/developer-guides/api-intro/marketplace-api
