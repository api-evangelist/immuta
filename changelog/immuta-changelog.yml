- date: '2026-07-29'
  type: improvement
  title: New controls for administrators in Connections
  breaking: false
  highlights:
  - Integration settings now live inside connections, with ACTIVE / INACTIVE / UNHEALTHY
    health states
  - Per-object policy sync setting controls whether Immuta pushes policy down for a
    given data object
  - Detail pages for leaf data objects, linking to the corresponding data source
  - Tag inheritance assignable in bulk at database or schema level
  - Configurable New tag behavior in App Settings
  - Unhealthy connections can be force-deleted
  scope: [Databricks Unity Catalog, Snowflake]
- date: '2026-07-22'
  type: new feature
  title: Separate access and masking exception request forms for data products
  breaking: false
  highlights:
  - Data products can now carry two distinct request forms — one for data access requests,
    one for masking exception requests
  - Independent questions and separate data use agreements per form type
  - Brings data products in line with data assets, which already supported separate
    forms
  api_impact: 'Request app API: getRequestForms, dataAccessRequestFormId and maskingExceptionRequestFormId'
- date: '2026-07-16'
  type: announcement
  title: Snowflake integration architecture updates
  breaking: false
  behavior_change: true
  rollout_start: '2026-07-23'
  highlights:
  - Immuta policy role names change (metadata-only); user role names unchanged
  - No downtime and no end-user impact during migration
  - Manual data policy resync now resyncs both data and subscription policies
  - Integration error banners removed in favour of the new connections experience
