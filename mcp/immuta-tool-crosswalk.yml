mcp_only:
- tool: searchDocumentation
  reason: documentation-corpus search; no REST operation in any published Immuta API
    exposes documentation search
- tool: getPage
  reason: fetches a documentation page as markdown; the equivalent affordance outside
    MCP is GET <docs-page>.md, not an API operation
- tool: askQuestion
  reason: retrieval-augmented answer over the docs corpus; the equivalent affordance
    outside MCP is GET <docs-page>.md?ask=<question>, not an API operation
- tool: sendFeedback
  reason: writes a docs feedback report into GitBook, not into Immuta
