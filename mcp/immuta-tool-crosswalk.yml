summary: 'Immuta''s two machine-readable surfaces do not overlap. The published MCP
  server is a documentation server (GitBook, served from documentation.immuta.com)
  whose four tools read and query the docs corpus; the published OpenAPI is the Data
  Marketplace / Request app REST API with 83 operations. No MCP tool is backed by a
  REST operation, and no REST operation has an MCP tool. This is a clean surface divergence,
  recorded rather than papered over: an agent that mounts Immuta''s MCP server can
  read Immuta''s documentation but cannot request access to a data product, and an
  agent that holds a Marketplace PAT can do the reverse.'
surfaces:
