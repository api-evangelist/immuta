notes: 'This is a documentation MCP server — it exposes Immuta''s docs corpus to agents,
  not the Immuta control plane. It is served from Immuta''s own documentation host
  and is provided by the GitBook docs platform Immuta publishes on. Immuta separately
  markets "Immuta AI" with MCP exposure of its data-access decisioning
  (https://www.immuta.com/resources/immuta-ai-and-model-context-protocol-mcp/), but
  publishes no endpoint URL, tool list or configuration guidance for that server —
  as of 2026-08-01 there is no publicly callable Immuta product MCP endpoint to record.
  The documentation also ships a GitBook agent-query affordance that is not MCP: any
  docs page can be queried with GET <page>.md?ask=<question>&goal=<goal>.'
